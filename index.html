<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ТОЛЬКО ВВЕРХ! — Говорящий Том</title>
    <!-- Telegram WebApp SDK и PeerJS для P2P Дуэли -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Trebuchet MS', 'Arial Black', sans-serif; touch-action: none; }
        body { background: #1a0f07; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* Основной контейнер экрана игры */
        #app-wrapper { position: relative; width: 100%; max-width: 440px; height: 100vh; max-height: 900px; background: #fce1a6; overflow: hidden; box-shadow: 0 0 45px rgba(0,0,0,0.85); }
        canvas { display: block; width: 100%; height: 100%; }

        /* Верхняя панель (HUD) */
        #hud { position: absolute; top: 14px; left: 10px; right: 10px; display: none; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
        .pill { background: #fff; border: 3px solid #2b1708; border-radius: 22px; padding: 4px 12px; font-weight: 900; font-size: 15px; color: #1a0f07; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 0 rgba(0,0,0,0.28); }
        .pill.gold { background: #b8f246; }
        .pill.enemy { background: rgba(239, 68, 68, 0.95); color: #fff; display: none; }
        .hud-btns { display: flex; gap: 8px; pointer-events: auto; }
        .icon-btn { width: 38px; height: 38px; border-radius: 50%; background: #2b1708; color: #fff; border: 2.5px solid #fff; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 0 rgba(0,0,0,0.35); }
        .icon-btn:active { transform: translateY(2px); }

        /* Оверлеи меню */
        .overlay { position: absolute; inset: 0; background: rgba(28, 15, 6, 0.82); backdrop-filter: blur(5px); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 18px; }
        .overlay.active { display: flex; }

        /* Вестерн-карточка */
        .card { background: linear-gradient(180deg, #ffebc2 0%, #f0c27b 100%); border: 5px solid #4a2810; border-radius: 26px; padding: 22px 18px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 12px 0 #261305, 0 16px 30px rgba(0,0,0,0.6); }
        .title { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #4a2810, -2px -2px 0 #4a2810, 2px -2px 0 #4a2810, -2px 2px 0 #4a2810, 2px 2px 0 #4a2810; margin-bottom: 14px; }

        /* Кнопки меню */
        .btn { width: 100%; padding: 13px; margin: 6px 0; border-radius: 16px; border: 3px solid #3a1e0a; font-size: 17px; font-weight: 900; color: #fff; cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,0.45); box-shadow: 0 6px 0 #3a1e0a; transition: transform 0.08s, box-shadow 0.08s; }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #3a1e0a; }
        .btn-solo { background: linear-gradient(180deg, #56d943, #35a824); }
        .btn-duel { background: linear-gradient(180deg, #ff7b29, #d94b07); }
        .btn-custom { background: linear-gradient(180deg, #a855f7, #7e22ce); }
        .btn-lead { background: linear-gradient(180deg, #3da5ff, #1b6ec2); }
        .btn-back { background: linear-gradient(180deg, #9e9083, #6e6257); margin-top: 10px; }

        /* Элементы Дуэли */
        .code-input { width: 100%; padding: 10px; font-size: 24px; font-weight: 900; text-align: center; letter-spacing: 8px; border: 3px solid #4a2810; border-radius: 14px; background: #fff8eb; color: #2b1708; margin: 8px 0; outline: none; }
        .room-box { font-size: 32px; font-weight: 900; color: #d94b07; background: #fff; border: 3px dashed #4a2810; border-radius: 14px; padding: 8px; margin: 8px 0; letter-spacing: 6px; }
        .status-txt { font-size: 13px; color: #4a2810; font-weight: bold; margin: 6px 0; min-height: 18px; }

        /* Таблица лидеров */
        .leader-list { list-style: none; margin: 8px 0; max-height: 200px; overflow-y: auto; text-align: left; background: rgba(255,255,255,0.7); border-radius: 14px; padding: 6px; border: 2px solid #4a2810; }
        .leader-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(74,40,16,0.18); font-weight: bold; color: #2b1708; font-size: 14px; }
        .leader-item:last-child { border-bottom: none; }

        /* Вкладки меню кастомизации */
        .tabs { display: flex; gap: 4px; margin-bottom: 10px; background: rgba(74,40,16,0.15); padding: 4px; border-radius: 12px; }
        .tab-btn { flex: 1; padding: 6px 2px; font-size: 12px; font-weight: 900; border-radius: 8px; border: none; background: transparent; color: #4a2810; cursor: pointer; }
        .tab-btn.active { background: #4a2810; color: #fff; }
        .tab-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 220px; overflow-y: auto; padding: 4px; }
        .custom-item { background: #fff; border: 2.5px solid #4a2810; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; box-shadow: 0 4px 0 #4a2810; }
        .custom-item.selected { border-color: #22c55e; background: #f0fdf4; box-shadow: 0 4px 0 #15803d; }
        .custom-icon { font-size: 26px; }
        .custom-name { font-size: 13px; font-weight: 900; color: #2b1708; }
        .custom-status { font-size: 11px; font-weight: bold; color: #16a34a; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <!-- Игровой холст -->
    <canvas id="gameCanvas"></canvas>

    <!-- Верхний бар (HUD) -->
    <div id="hud">
        <div style="display:flex; gap:6px; align-items:center;">
            <div class="pill">🏆 <span id="hud-score">0</span></div>
            <div class="pill enemy" id="hud-enemy-pill">👻 <span id="hud-enemy-score">0</span></div>
            <div class="pill gold">👑 <span id="hud-best">0</span></div>
        </div>
        <div class="hud-btns">
            <button class="icon-btn" id="btn-mute" title="Звук">🔊</button>
            <button class="icon-btn" id="btn-restart" title="Заново">↻</button>
            <button class="icon-btn" id="btn-menu" title="В меню">✖</button>
        </div>
    </div>

    <!-- 1. Главное меню -->
    <div id="screen-menu" class="overlay active">
        <div class="card">
            <div class="title">ТОЛЬКО ВВЕРХ!</div>
            <button class="btn btn-solo" id="start-solo-btn">🐾 ИГРАТЬ СОЛО</button>
            <button class="btn btn-duel" id="open-duel-btn">⚔️ ДУЭЛЬ 1 НА 1</button>
            <button class="btn btn-custom" id="open-custom-btn">🎨 КАСТОМИЗАЦИЯ</button>
            <button class="btn btn-lead" id="open-lead-btn">🏆 ТОП ЛИДЕРОВ</button>
        </div>
    </div>

    <!-- 2. Меню Дуэли -->
    <div id="screen-duel" class="overlay">
        <div class="card">
            <div class="title">ДУЭЛЬ 1 НА 1</div>
            <button class="btn btn-solo" id="create-room-btn">СОЗДАТЬ КОМНАТУ</button>
            <div id="created-room-block" style="display:none;">
                <div class="status-txt">Передай этот код другу:</div>
                <div class="room-box" id="room-code-display">----</div>
            </div>
            <div style="margin: 8px 0; font-weight:900; color:#4a2810;">— ИЛИ ВВЕДИ КОД —</div>
            <input type="text" id="join-code-input" class="code-input" maxlength="4" placeholder="1234" inputmode="numeric">
            <button class="btn btn-duel" id="join-room-btn">ПОДКЛЮЧИТЬСЯ</button>
            <div class="status-txt" id="net-status">Готов к подключению</div>
            <button class="btn btn-back" data-back="screen-menu">НАЗАД</button>
        </div>
    </div>

    <!-- 3. Меню единой кастомизации -->
    <div id="screen-custom" class="overlay">
        <div class="card">
            <div class="title">КАСТОМИЗАЦИЯ</div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="skins">Скины</button>
                <button class="tab-btn" data-tab="pins">Плитки</button>
                <button class="tab-btn" data-tab="bg">Фоны</button>
                <button class="tab-btn" data-tab="trails">Следы</button>
            </div>
            <div class="tab-grid" id="custom-grid-container"></div>
            <button class="btn btn-back" data-back="screen-menu">НАЗАД</button>
        </div>
    </div>

    <!-- 4. Таблица лидеров -->
    <div id="screen-leaders" class="overlay">
        <div class="card">
            <div class="title">ТОП ИГРОКОВ</div>
            <ul class="leader-list" id="leader-list-container">
                <li class="leader-item"><span>Загрузка...</span><span>---</span></li>
            </ul>
            <button class="btn btn-back" data-back="screen-menu">НАЗАД</button>
        </div>
    </div>

    <!-- 5. Экран завершения игры -->
    <div id="screen-gameover" class="overlay">
        <div class="card">
            <div class="title" id="go-title">ИГРА ОКОНЧЕНА</div>
            <div class="status-txt" id="go-subtitle" style="font-size:16px;">Твой счёт: 0</div>
            <button class="btn btn-solo" id="go-retry-btn">ЕЩЁ РАЗ</button>
            <button class="btn btn-back" id="go-menu-btn">В МЕНЮ</button>
        </div>
    </div>
</div>

<!-- Единый диспетчер интерфейса (AppHub) -->
<script>
window.AppHub = {
    mode: 'solo',
    roomSeed: Date.now(),
    currentTab: 'skins',

    showScreen(id) {
        document.querySelectorAll('.overlay').forEach(el => el.classList.remove('active'));
        if (id) document.getElementById(id).classList.add('active');
        document.getElementById('hud').style.display = id ? 'none' : 'flex';
    },

    startGame(mode, seed = Date.now()) {
        this.mode = mode;
        this.roomSeed = seed;
        this.showScreen(null);
        document.getElementById('hud-enemy-pill').style.display = (mode === 'duel') ? 'flex' : 'none';
        if (window.sfx && typeof window.sfx.startBgm === 'function') {
            window.sfx.startBgm();
        }
        if (window.GameEngine && typeof window.GameEngine.start === 'function') {
            window.GameEngine.start({ mode, seed });
        }
    },

    onGameOver(resultData) {
        this.showScreen('screen-gameover');
        document.getElementById('go-title').textContent = resultData.title || 'ИГРА ОКОНЧЕНА';
        document.getElementById('go-subtitle').textContent = resultData.subtitle || `Очки: ${resultData.score}`;
        if (window.Leaderboard && typeof window.Leaderboard.submitScore === 'function') {
            window.Leaderboard.submitScore(resultData.score);
        }
    },

    renderCustomTab(tabKey) {
        this.currentTab = tabKey;
        const container = document.getElementById('custom-grid-container');
        if (!container) return;
        container.innerHTML = '';

        const items = (window.CustomManager && typeof window.CustomManager.getItems === 'function')
            ? window.CustomManager.getItems(tabKey)
            : [];

        items.forEach(it => {
            const div = document.createElement('div');
            div.className = `custom-item ${it.active ? 'selected' : ''}`;
            div.innerHTML = `
                <div class="custom-icon">${it.icon}</div>
                <div class="custom-name">${it.name}</div>
                <div class="custom-status">${it.active ? 'Выбрано' : 'Надеть'}</div>
            `;
            div.onclick = () => {
                if (window.CustomManager) window.CustomManager.select(tabKey, it.id);
                AppHub.renderCustomTab(tabKey);
            };
            container.appendChild(div);
        });
    }
};

// Обработчики кнопок
document.getElementById('start-solo-btn').onclick = () => AppHub.startGame('solo');
document.getElementById('open-duel-btn').onclick = () => AppHub.showScreen('screen-duel');
document.getElementById('open-custom-btn').onclick = () => {
    AppHub.showScreen('screen-custom');
    AppHub.renderCustomTab(AppHub.currentTab);
};
document.getElementById('open-lead-btn').onclick = () => {
    AppHub.showScreen('screen-leaders');
    if (window.Leaderboard) window.Leaderboard.renderList();
};
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        AppHub.renderCustomTab(btn.dataset.tab);
    };
});
document.querySelectorAll('[data-back]').forEach(btn => {
    btn.onclick = () => AppHub.showScreen(btn.getAttribute('data-back'));
});
document.getElementById('btn-mute').onclick = (e) => {
    if (window.sfx) {
        const isMuted = window.sfx.toggleMute();
        e.target.textContent = isMuted ? '🔇' : '🔊';
    }
};
document.getElementById('btn-menu').onclick = () => {
    if (window.GameEngine) window.GameEngine.stop();
    if (window.sfx) window.sfx.stopBgm();
    if (window.DuelNetwork) window.DuelNetwork.disconnect();
    AppHub.showScreen('screen-menu');
};
document.getElementById('btn-restart').onclick = () => AppHub.startGame(AppHub.mode);
document.getElementById('go-retry-btn').onclick = () => {
    if (AppHub.mode === 'solo') AppHub.startGame('solo');
    else AppHub.showScreen('screen-duel');
};
document.getElementById('go-menu-btn').onclick = () => {
    if (window.sfx) window.sfx.stopBgm();
    AppHub.showScreen('screen-menu');
};
</script>

<!-- ========================================== -->
<!-- ПРАВИЛЬНЫЙ БЛОК ЗАГРУЗКИ СКРИПТОВ          -->
<!-- ========================================== -->

<!-- 1. Сетевые модули -->
<script src="leaderboard.js"></script>
<script src="network.js"></script>

<!-- 2. Независимые движки -->
<script src="sound.js"></script>
<script src="playlist.js"></script>
<script src="physics.js"></script>

<!-- 3. Визуальные модули и контент (ЗАГРУЖАЕМ СИНХРОННО!) -->
<!-- УБРАН obstacles.js (он теперь в background.js) -->
<script src="model.js"></script>
<script src="pins.js"></script>
<script src="background.js"></script>
<script src="trails.js"></script>

<!-- 4. Главный хаб кастомизации -->
<script src="skins.js"></script>

<!-- 5. Игровое ядро -->
<script src="game.js"></script>

</body>
</html>
